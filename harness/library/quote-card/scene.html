<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* The frame is used from top to foot: the set-up hangs from the top margin, the payoff takes the width, the name stands on the bottom
     margin. A quote floating in the upper two thirds with nothing under it reads as a slide someone stopped working on. */
  html, body { margin: 0; overflow: hidden; background: var(--pp-paper); }
  body { width: 100vw; height: 100vh; position: relative; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; transform-origin: center bottom; }
  .abs { position: absolute; }
  .mask { overflow: hidden; }
  .setup { font-family: var(--pp-body); font-weight: var(--pp-bw, 600); letter-spacing: var(--pp-bt, 0); color: var(--pp-ink); line-height: 1.16; }
  .setup .w { display: inline-block; white-space: pre; }
  .pay { font-family: var(--pp-display); font-weight: var(--pp-dw, 700); letter-spacing: var(--pp-dt, -0.02em); text-transform: var(--pp-dc, none); font-variation-settings: var(--pp-dv, normal); line-height: 1.08; white-space: nowrap; }
  .pay .w { display: inline-block; position: relative; white-space: pre; vertical-align: top; }
  .pay .hl { position: absolute; left: -0.14em; right: -0.14em; top: -0.11em; bottom: -0.17em; transform-origin: left center; }
  .pay .t { position: relative; }
  .pay .t.on { position: absolute; left: 0; top: 0; }
  .who { display: flex; align-items: center; }
  .rule { flex: none; transform-origin: left center; }
  .name { font-family: var(--pp-body); font-weight: 700; white-space: nowrap; line-height: 1.2; }
  .role { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); white-space: nowrap; line-height: 1.2; }
</style></head>
<body>
  <div class="band" id="band"></div>
  <div class="abs setup" id="setup"></div>
  <div class="abs" id="payBox"></div>
  <div class="abs who" id="who"><div class="rule" id="rule"></div><div><div class="mask"><div class="name" id="name"></div></div><div class="mask"><div class="role" id="role"></div></div></div></div>
<script src="../../pp-scene.js"></script>
<script>
(() => {
  const P = PP.props, $ = (id) => document.getElementById(id), F = PP.f, E = PP.enter;
  const W = PP.size.width, H = PP.size.height, upright = H > W, u = Math.min(W, H) / 1080;
  const D = +P.duration || 8, form = P.form || PP.style.forms?.['quote-card'] || 'wall', block = form === 'block';
  const cols = PP.style.colours || {}, accent = cols.accent || '#000000';
  // a mid-tone accent carries neither ink nor paper well enough for the words on it: the band goes to ink, and the accent marks the word
  const bandColour = PP.on(accent).ratio >= 7 ? accent : cols.ink || accent, onBand = PP.on(bandColour);
  const same = (a, b) => String(a || '').replace(/[^\w]/g, '').toLowerCase() === String(b || '').replace(/[^\w]/g, '').toLowerCase();
  const words = (el, text) => String(text).split(/\s+/).filter(Boolean).map((w, i, all) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = i < all.length - 1 ? `${w} ` : w; el.appendChild(s); return s; });

  const setupW = words($('setup'), P.setup);
  const dropped = setupW.find((s) => P.drop && same(s.textContent, P.drop));
  // the beats: the set-up reads, the payoff lands on one hit, then the words act, then who said it
  // the set-up is on screen from frame 0, the thumbnail on social; it is read, then the payoff lands
  const n = setupW.length, stepS = 0, T = { setup: -1 }, READ = Math.max(1.2, 0.3 * n);
  T.pay = READ; T.act = T.pay + F(18); T.who = T.act + F(14);
  const OUT = D - F(14), OUTLEN = F(9);
  const lines = [];

  PP.scene({
    duration: D,
    setup() {
      const m = { x: W * (upright ? 0.08 : 0.05) + 0, top: H * (upright ? 0.14 : 0.09), foot: H * (upright ? 0.17 : 0.1) };
      const wide = (W - 2 * m.x) * 0.98;
      for (const id of ['setup', 'payBox', 'who']) $(id).style.left = `${Math.round(m.x)}px`;
      $('setup').style.top = `${Math.round(m.top)}px`; $('setup').style.width = `${Math.round(wide)}px`;
      $('setup').style.fontSize = `${Math.round((upright ? 64 : 72) * u)}px`;
      $('name').style.fontSize = `${Math.round(76 * u)}px`; $('name').parentNode.style.marginBottom = `${Math.round(14 * u)}px`; $('role').style.fontSize = `${Math.round(52 * u)}px`;
      $('name').textContent = P.name; $('role').textContent = P.role || ''; if (!P.role) $('role').parentNode.remove();
      const setupB = $('setup').getBoundingClientRect().bottom;
      const whoH = $('who').getBoundingClientRect().height, whoY = H - m.foot - whoH;
      $('who').style.top = `${Math.round(whoY)}px`;
      // the payoff in the fewest lines that let it fill the width: the room between the set-up and the name decides how many
      const roomTop = setupB + H * (block ? 0.11 : 0.06), roomH = whoY - roomTop - H * 0.05;
      const parts = String(P.payoff).split(/\s+/).filter(Boolean);
      const measure = document.createElement('div'); measure.className = 'pay'; measure.style.cssText = 'position:absolute;visibility:hidden;font-size:100px'; document.body.appendChild(measure);
      const widthOf = (s) => { measure.textContent = s; return measure.getBoundingClientRect().width; };
      let bestPlan = null;
      for (let k = 1; k <= Math.min(upright ? 4 : 3, parts.length); k++) {
        // k lines, broken where the widest line is narrowest
        const split = (i, left) => { if (left === 1) return [[parts.slice(i).join(' ')]]; const all = []; for (let j = i + 1; j <= parts.length - left + 1; j++) for (const r of split(j, left - 1)) all.push([parts.slice(i, j).join(' '), ...r]); return all; };
        for (const plan of split(0, k)) {
          const size = Math.min((wide / Math.max(...plan.map(widthOf))) * 100, roomH / k / 1.34, H * 0.3);
          if (!bestPlan || size > bestPlan.size) bestPlan = { plan, size };
        }
      }
      measure.remove();
      const box = $('payBox'), size = Math.floor(bestPlan.size), lh = size * 1.34, blockH = lh * bestPlan.plan.length;
      const onInk = block ? onBand.colour : 'var(--pp-ink)';
      bestPlan.plan.forEach((line) => {
        const m2 = document.createElement('div'), row = document.createElement('div'); m2.className = 'mask'; row.className = 'pay'; row.style.fontSize = `${size}px`; row.style.color = onInk; m2.style.height = `${Math.round(lh)}px`;
        const ws = words(row, line); m2.appendChild(row); box.appendChild(m2); lines.push({ row, ws });
      });
      box.style.top = `${Math.round(roomTop + (roomH - blockH) / 2)}px`;
      // the marked word gets a highlight behind it, and takes whichever ink stands out on the highlight
      const hlColour = block && bandColour === accent ? cols.accent2 || cols.paper : accent, onHl = PP.on(hlColour).colour;
      for (const l of lines) for (const w of l.ws) if (P.mark && same(w.textContent, P.mark)) {
        const t = document.createElement('span'), on = document.createElement('span'), hl = document.createElement('span'); t.className = 't'; t.textContent = w.textContent; on.className = 't on'; on.id = 'hlOn'; on.dataset.ppTwin = '1'; on.textContent = w.textContent; on.style.color = onHl; hl.className = 'hl'; hl.id = 'hl'; hl.style.background = hlColour; w.textContent = ''; w.append(hl, t, on); w.style.marginLeft = '0.26em'; w.style.marginRight = '0.18em'; // the highlight stands clear of the words beside it
      }
      // block: the band rises to meet the payoff, from just under the set-up to the foot of the frame
      if (block) { $('band').style.background = bandColour; $('band').style.height = `${Math.round(H - (setupB + H * 0.06))}px`; } else $('band').remove();
      const whoInk = block ? onBand.colour : 'var(--pp-ink)';
      $('name').style.color = whoInk; $('role').style.color = whoInk;
      $('rule').style.cssText = `width:${Math.round(14 * u)}px;height:${Math.round(96 * u)}px;margin-right:${Math.round(26 * u)}px;background:${block ? whoInk : accent}`;
    },
    frame(t) {
      const out = PP.ease.exit(PP.clamp((t - OUT) / OUTLEN));
      const d = PP.p(t, T.act, T.act + F(16), PP.ease.move);
      setupW.forEach((w, i) => { const a = T.setup + i * stepS, v = PP.p(t, a, a + F(12), E); w.style.opacity = v * (1 - out) * (w === dropped ? 1 - d * 0.62 : 1); w.style.transform = `translateY(${(1 - v) * 40 * u - out * 18 * u}px)`; });
      if (dropped) { if (d > 0) dropped.dataset.ppSpent = '1'; else delete dropped.dataset.ppSpent; }
      if (block) $('band').style.transform = `scaleY(${PP.p(t, T.pay - F(5), T.pay + F(9), PP.ease.snap) * (1 - PP.ease.exit(PP.clamp((t - OUT - F(4)) / OUTLEN)))})`;
      lines.forEach((l, i) => { const a = T.pay + i * F(3); l.row.style.transform = `translateY(${(1 - PP.p(t, a, a + F(14), E)) * 104 + out * 104}%)`; });
      const hl = $('hl');
      // the word takes the highlight's ink exactly where the highlight has reached, so no letter is ever dark on the dark ground
      if (hl) { const v = PP.p(t, T.act + F(4), T.act + F(20), PP.ease.move) * (1 - out); hl.style.transform = `scaleX(${v})`; $('hlOn').style.clipPath = `inset(-20% ${(1 - v) * 100}% -20% -6%)`; hl.nextSibling.style.clipPath = `inset(-20% -6% -20% ${v * 100}%)`; }
      const w = PP.p(t, T.who, T.who + F(12), E); $('rule').style.transform = `scaleY(${w * (1 - out)})`;
      const rise = (el, a, d) => { if (el) el.style.transform = `translateY(${(1 - PP.p(t, a, a + d, E)) * 104 + out * 104}%)`; };
      rise($('name'), T.who + F(3), F(13)); rise($('role'), T.who + F(6), F(12));
    },
    // A low bed the whole way, one hit where the payoff lands, one tick as the highlight finishes. The set-up gets no sound: let it be read.
    sound: () => (P.sound === false ? [] : [
      { sfx: 'pad', at: 0, dur: D, note: 98, minor: true, seed: 3, gain_db: -22, fade_in: 0.6 },
      { sfx: 'room', at: 0, dur: D, seed: 2, gain_db: -46 },
      { sfx: 'swell', hit: T.pay + F(2), dur: 0.7, seed: 4, gain_db: -17 },
      { sfx: 'impact', hit: T.pay + F(2), seed: 6, size: 0.7, gain_db: -11 },
      { sfx: 'tick', hit: T.act + F(20), seed: 2, note: 2100, gain_db: -22 },
    ]),
  });
})();
</script>
</body></html>
