<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: var(--pp-paper); }
  body { width: 100vw; height: 100vh; position: relative; }
  #fade { position: absolute; inset: 0; }
  svg { position: absolute; left: 0; top: 0; display: block; }
  .land { fill: var(--pp-ink); fill-opacity: 0.045; stroke: var(--pp-ink); stroke-opacity: 0.34; stroke-linejoin: round; }
  .home { fill-opacity: 0.11; stroke-opacity: 0.5; }
  .grat { fill: none; stroke: var(--pp-ink); stroke-opacity: 0.08; }
  .route { fill: none; stroke: var(--pp-accent); stroke-linecap: round; stroke-linejoin: round; }
  /* every piece of text sits on a knock-out of the paper colour, so no map line ever runs through it */
  .box { position: absolute; background: var(--pp-paper); white-space: nowrap; }
  .title { font-family: var(--pp-display); font-weight: 520; color: var(--pp-ink); letter-spacing: -0.012em; line-height: 1.05; }
  .tag { font-family: var(--pp-body); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--pp-muted); line-height: 1.2; }
  .day { font-family: var(--pp-mono); font-weight: 500; color: var(--pp-ink); line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .mode { font-family: var(--pp-body); font-weight: 500; color: var(--pp-muted); line-height: 1.2; text-align: right; }
  .name { font-family: var(--pp-body); font-weight: 600; color: var(--pp-ink); line-height: 1.15; }
  .note { font-family: var(--pp-mono); font-weight: 400; color: var(--pp-ink); opacity: 0.72; line-height: 1.2; font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div id="fade">
  <svg id="map"><g id="cam"><g id="grat"></g><g id="land"></g><path id="route" class="route"></path></g></svg>
  <svg id="marks"></svg>
  <div id="labels"></div>
</div>
<script src="../../pp-scene.js"></script>
<script>
(() => {
  const P = PP.props, D = +P.duration || 8, $ = (id) => document.getElementById(id);
  const W = PP.size.width, H = PP.size.height, portrait = H > W;
  const u = portrait ? W / 1080 : H / 1080;
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const a in at) e.setAttribute(a, at[a]); parent.appendChild(e); return e; };
  const div = (cls, parent) => { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; };
  for (const s of [$('map'), $('marks')]) { s.setAttribute('width', W); s.setAttribute('height', H); }

  // Mercator, in degree-like units (x = longitude, y = -mercator(latitude)) so the map is drawn once and the camera only moves it
  const R2D = 180 / Math.PI;
  const proj = ([lon, lat]) => [lon, -R2D * Math.log(Math.tan(Math.PI / 4 + (Math.max(-82, Math.min(84, lat)) * Math.PI) / 360))];
  const ringD = (ring) => ring.map((p, i) => { const [x, y] = proj(p); return `${i ? 'L' : 'M'}${x.toFixed(3)},${y.toFixed(3)}`; }).join('') + 'Z';
  const geomD = (g) => (g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : []).map((poly) => poly.map(ringD).join('')).join('');

  // the route: stops joined through each leg's waypoints, smoothed (Catmull-Rom) in map space
  const stops = P.stops || [], legs = P.legs || [];
  const legPts = legs.map((leg, i) => [stops[i].lonlat, ...(leg.via || []), stops[i + 1].lonlat].map(proj));
  const smooth = (pts, per = 14) => {
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (let s = 1; s <= per; s++) {
        const t = s / per, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map((k2) => 0.5 * (2 * p1[k2] + (-p0[k2] + p2[k2]) * t + (2 * p0[k2] - 5 * p1[k2] + 4 * p2[k2] - p3[k2]) * t2 + (-p0[k2] + 3 * p1[k2] - 3 * p2[k2] + p3[k2]) * t3)));
      }
    }
    return out;
  };
  const legPaths = legPts.map((pts) => { const s = smooth(pts); const L = [0]; for (let i = 1; i < s.length; i++) L.push(L[i - 1] + Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1])); return { s, L }; });
  const upTo = (leg, f) => { // the leg's points up to fraction f of its length, with the exact head
    const { s, L } = leg, want = f * L[L.length - 1], pts = [s[0]];
    for (let i = 1; i < s.length; i++) { if (L[i] <= want) { pts.push(s[i]); continue; } const r = (want - L[i - 1]) / (L[i] - L[i - 1]); pts.push([s[i - 1][0] + (s[i][0] - s[i - 1][0]) * r, s[i - 1][1] + (s[i][1] - s[i - 1][1]) * r]); break; }
    return pts;
  };

  // timing: each leg gets time by how long it took, within a window; the sea leg is the long one
  const t0 = 0.85, t1 = D - 1.55, days = stops.map((s) => +s.day);
  const span = days[days.length - 1] - days[0] || 1, pause = 0.22;
  const legT = legs.map((_, i) => { const w = (t1 - t0 - pause * (legs.length - 1)); const a = t0 + ((days[i] - days[0]) / span) * w + pause * i; const b = t0 + ((days[i + 1] - days[0]) / span) * w + pause * i; return [a, Math.max(a + 0.6, b)]; });
  // a short road leg still needs time to read: re-spread so every leg has at least 0.6 s
  for (let i = 1; i < legT.length; i++) if (legT[i][0] < legT[i - 1][1] + pause) { const d = legT[i - 1][1] + pause - legT[i][0]; legT[i][0] += d; legT[i][1] += d; }
  const over = legT[legT.length - 1][1] - t1; if (over > 0) { const sea = legT.reduce((m, x, i) => (x[1] - x[0] > legT[m][1] - legT[m][0] ? i : m), 0); legT[sea][1] -= over; for (let i = sea + 1; i < legT.length; i++) { legT[i][0] -= over; legT[i][1] -= over; } }
  const stopT = stops.map((_, i) => (i === 0 ? t0 - 0.35 : legT[i - 1][1]));

  // the camera: fit the route (with room for labels), then push in slowly
  const all = legPts.flat(), bx = [Math.min(...all.map((p) => p[0])), Math.max(...all.map((p) => p[0]))], by = [Math.min(...all.map((p) => p[1])), Math.max(...all.map((p) => p[1]))];
  const cx = (bx[0] + bx[1]) / 2, cy = (by[0] + by[1]) / 2;
  const fitW = portrait ? 0.64 : 0.62, fitH = portrait ? 0.42 : 0.7;
  const s0 = Math.min((W * fitW) / (bx[1] - bx[0]), (H * fitH) / (by[1] - by[0])), push = 1.14;
  const sx0 = W * 0.5, sy0 = H * 0.5;
  const cam = (t) => { const k2 = PP.p(t, 0, D, PP.ease.inOut); return { s: s0 * (1 + (push - 1) * k2), x: cx + (bx[1] - cx) * 0.06 * k2, y: cy }; };
  const toScreen = (p, c) => [sx0 + (p[0] - c.x) * c.s, sy0 + (p[1] - c.y) * c.s];

  // text: title (top left), the day counter (top right), one label per stop
  const lab = $('labels'), pad = [6 * u, 12 * u];
  const safeX = W * 0.06, safeY = H * 0.06;
  const labelAt = (side, x, y, w, h, g) => ({ right: [x + g, y - h / 2], left: [x - g - w, y - h / 2], above: [mid(x, w), y - g - h], below: [mid(x, w), y + g],
    aboveleft: [x - 0.7 * g - w, y - 0.7 * g - h], belowleft: [x - 0.7 * g - w, y + 0.7 * g], aboveright: [x + 0.7 * g, y - 0.7 * g - h], belowright: [x + 0.7 * g, y + 0.7 * g] })[side];
  const mid = (x, w) => Math.min(W - safeX + pad[1] - w, Math.max(safeX - pad[1], x - w / 2));   // a label above or below a stop, kept inside title-safe
  const titleBox = div('box', lab); titleBox.style.padding = `${pad[0]}px ${pad[1]}px`; titleBox.style.left = `${safeX - pad[1]}px`; titleBox.style.top = `${safeY}px`;
  const tag = div('tag', titleBox); tag.textContent = P.tag || `${stops.length} stops · ${span} days`; tag.style.fontSize = `${18 * u}px`; tag.style.marginBottom = `${10 * u}px`;
  const title = div('title', titleBox); title.textContent = P.title || ''; title.style.fontSize = `${(portrait ? 58 : 54) * u}px`;
  const dayBox = div('box', lab); dayBox.style.padding = `${pad[0]}px ${pad[1]}px`; dayBox.style.right = `${safeX - pad[1]}px`; dayBox.style.bottom = `${safeY}px`;
  const day = div('day', dayBox); day.style.fontSize = `${54 * u}px`;
  const mode = div('mode', dayBox); mode.style.fontSize = `${20 * u}px`; mode.style.marginTop = `${10 * u}px`;
  const L = stops.map((st) => { const b = div('box', lab); b.style.padding = `${pad[0]}px ${pad[1]}px`; const n = div('name', b); n.textContent = st.name; n.style.fontSize = `${23 * u}px`; const o = div('note', b); o.textContent = st.note || ''; o.style.fontSize = `${18 * u}px`; o.style.marginTop = `${4 * u}px`; return b; });
  const marks = $('marks');
  const dots = stops.map((_, i) => ({ ring: mk('circle', { r: 7 * u, fill: 'var(--pp-paper)', stroke: 'var(--pp-ink)', 'stroke-width': Math.max(2, 2 * u) }, marks), core: mk('circle', { r: 3 * u, fill: i === stops.length - 1 ? 'var(--pp-accent)' : 'var(--pp-ink)' }, marks) }));
  const head = mk('circle', { r: 4.5 * u, fill: 'var(--pp-accent)' }, marks);

  let placed = [];
  PP.scene({
    duration: D,
    async setup() {
      const [land, countries] = await Promise.all(['../../vendor/ne_110m_land.geojson', '../../vendor/ne_110m_admin_0_countries.geojson'].map((f) => fetch(f).then((r) => r.json())));
      const g = $('land'), hl = new Set(P.highlight_countries || []);
      const sw = Math.max(1, 1.25 * u);
      for (const f of land.features) mk('path', { d: geomD(f.geometry), class: 'land', 'vector-effect': 'non-scaling-stroke', 'stroke-width': sw }, g);
      for (const f of countries.features) if (hl.has(f.properties.ADMIN) || hl.has(f.properties.NAME)) mk('path', { d: geomD(f.geometry), class: 'land home', 'vector-effect': 'non-scaling-stroke', 'stroke-width': sw }, g);
      const gr = $('grat'), y = (lat) => proj([0, lat])[1];
      for (let lon = -180; lon <= 180; lon += 10) mk('path', { d: `M${lon},${y(-70)}L${lon},${y(80)}`, class: 'grat', 'vector-effect': 'non-scaling-stroke', 'stroke-width': Math.max(1, u) }, gr);
      for (let lat = -60; lat <= 80; lat += 10) mk('path', { d: `M-180,${y(lat)}L180,${y(lat)}`, class: 'grat', 'vector-effect': 'non-scaling-stroke', 'stroke-width': Math.max(1, u) }, gr);
      day.textContent = `Day ${days[days.length - 1]}`; day.style.minWidth = `${Math.ceil(day.getBoundingClientRect().width)}px`;   // the counter's box never changes width
      $('route').setAttribute('vector-effect', 'non-scaling-stroke'); $('route').setAttribute('stroke-width', Math.max(2, 3 * u));
      // place each label once, at the closest the camera gets: its preferred side, else the first side that stays inside
      // title-safe and clear of the other labels, the title, the counter and every stop's dot
      const c = cam(D), rect = (e) => e.getBoundingClientRect();
      const obstacles = [titleBox, dayBox].map((e) => { const r = rect(e); return [r.left, r.top, r.right, r.bottom]; });
      const scr = stops.map((s) => toScreen(proj(s.lonlat), c));
      scr.forEach(([x, y2]) => obstacles.push([x - 10 * u, y2 - 10 * u, x + 10 * u, y2 + 10 * u]));
      // the drawn route is an obstacle too: a label never covers the line
      const route = []; legPaths.forEach((lp) => lp.s.forEach((p) => route.push(toScreen(p, c))));
      const hit = (a, b, m = 6 * u) => a[0] < b[2] + m && a[2] > b[0] - m && a[1] < b[3] + m && a[3] > b[1] - m;
      placed = stops.map((s, i) => {
        const r = rect(L[i]), w = r.width, h = r.height, [x, y2] = scr[i];
        const pref = s.side || 'right', order = [pref, 'right', 'left', 'above', 'below', 'aboveleft', 'belowleft', 'aboveright', 'belowright'];
        let best = null;
        for (const gap of [16, 34, 56]) for (const side of order) {
          const [lx, ly] = labelAt(side, x, y2, w, h, gap * u), box = [lx, ly, lx + w, ly + h];
          if (lx < safeX - pad[1] - 0.5 || ly < safeY - 0.5 || lx + w > W - safeX + pad[1] + 0.5 || ly + h > H - safeY + 0.5) continue;
          // the line may touch a label only right at its own stop, where it has to leave from
          const hits = obstacles.filter((o, j) => j !== 2 + i && hit(box, o)).length + route.filter(([px, py]) => Math.hypot(px - x, py - y2) > 26 * u && hit(box, [px, py, px, py], 3 * u)).length;
          if (!best || hits < best.hits) best = { side, gap: gap * u, w, h, hits, box };
          if (!hits) break;
        }
        if (!best) best = { side: pref, gap: 16 * u, w, h, box: [0, 0, 0, 0] };
        obstacles.push(best.box); return best;
      });
    },
    frame(t) {
      const c = cam(t);
      $('cam').setAttribute('transform', `translate(${sx0 - c.x * c.s} ${sy0 - c.y * c.s}) scale(${c.s})`);
      $('fade').style.opacity = 1 - PP.p(t, D - 0.4, D, PP.ease.inOut);
      $('map').style.opacity = PP.p(t, 0, 0.7, PP.ease.inOut);
      titleBox.style.opacity = PP.p(t, 0.15, 0.6); titleBox.style.transform = `translateY(${(1 - PP.p(t, 0.15, 0.65)) * 12 * u}px)`;
      dayBox.style.opacity = PP.p(t, 0.45, 0.9);
      // the line, leg by leg; the day counter and the mode follow the head
      const pts = []; let d = days[0], m = legs[0] ? legs[0].mode : '', hp = null;
      legs.forEach((leg, i) => {
        const f = PP.p(t, legT[i][0], legT[i][1], PP.ease.inOut);
        if (f <= 0) return;
        const seg = upTo(legPaths[i], f); pts.push(...(pts.length ? seg.slice(1) : seg)); hp = seg[seg.length - 1];
        d = days[i] + (days[i + 1] - days[i]) * f; m = f < 1 || i === legs.length - 1 ? leg.mode : m;
      });
      const arrived = t >= legT[legT.length - 1][1];
      $('route').setAttribute('d', pts.length > 1 ? 'M' + pts.map((p) => `${p[0].toFixed(3)},${p[1].toFixed(3)}`).join('L') : '');
      day.textContent = `Day ${Math.floor(d + 1e-6)}`;
      mode.textContent = arrived ? 'Arrived' : m;
      if (hp && !arrived) { const [hx, hy] = toScreen(hp, c); head.setAttribute('cx', hx); head.setAttribute('cy', hy); head.setAttribute('opacity', 1); } else head.setAttribute('opacity', 0);
      stops.forEach((s, i) => {
        const [x, y] = toScreen(proj(s.lonlat), c), a = PP.p(t, stopT[i], stopT[i] + 0.45);
        dots[i].ring.setAttribute('cx', x); dots[i].ring.setAttribute('cy', y); dots[i].core.setAttribute('cx', x); dots[i].core.setAttribute('cy', y);
        dots[i].ring.setAttribute('opacity', a); dots[i].core.setAttribute('opacity', a);
        dots[i].ring.setAttribute('r', 7 * u * (0.6 + 0.4 * a));
        const pl = placed[i]; if (!pl) return;
        const lift = (1 - PP.p(t, stopT[i] + 0.05, stopT[i] + 0.5)) * 8 * u;
        const at = labelAt(pl.side, x, y, pl.w, pl.h, pl.gap);
        L[i].style.left = `${at[0]}px`; L[i].style.top = `${at[1] + lift}px`; L[i].style.opacity = PP.p(t, stopT[i] + 0.05, stopT[i] + 0.5);
      });
    },
  });
})();
</script>
</body></html>
