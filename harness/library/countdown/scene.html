<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* one solid plate, opened from an accent bar like the lower third: it reads on any footage, where a soft dark field does not. Dial on the
     left, the number the eye wants on the right. Nothing the viewer must read is under 48 px, so the small print from the old dial is gone. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; position: relative; }
  .lt { position: absolute; display: flex; align-items: stretch; }
  .bar { flex: none; background: var(--pp-accent); transform-origin: center bottom; }
  .plate { overflow: hidden; background: var(--pp-paper); }
  .inner { box-sizing: border-box; width: max-content; display: flex; align-items: center; }
  .dialwrap { position: relative; flex: none; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .col { display: flex; flex-direction: column; }
  .mask { overflow: hidden; }
  .sup { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); letter-spacing: var(--pp-bt, 0); color: var(--pp-ink); opacity: 0.92; line-height: 1.2; white-space: nowrap; }
  .hero { font-family: var(--pp-display); font-weight: var(--pp-dw, 640); letter-spacing: var(--pp-dt, -0.015em); font-variation-settings: var(--pp-dv, normal); color: var(--pp-ink); line-height: 1.04; white-space: nowrap; display: flex; align-items: baseline; }
  .hero small { font-size: 0.42em; margin-left: 0.14em; }
  #secs, #grams { display: inline-block; }
</style></head>
<body>
  <div class="lt" id="lt">
    <div class="bar" id="bar"></div>
    <div class="plate" id="plate"><div class="inner" id="inner">
      <div class="dialwrap" id="dialwrap"><svg id="dial" viewBox="-100 -100 200 200"></svg></div>
      <div class="col" id="col">
        <div class="mask"><div class="sup" id="label"></div></div>
        <div class="mask"><div class="hero" id="heroRow"><span id="secs"></span><small>s</small></div></div>
        <div class="mask"><div class="sup" id="tgt"></div></div>
        <div class="mask"><div class="sup" id="outRow"><span id="grams"></span> <span id="outLabel"></span></div></div>
      </div>
    </div></div>
  </div>
<script src="../../pp-scene.js"></script>
<script>
(() => {
  const P = PP.props, $ = (id) => document.getElementById(id), F = PP.f, E = PP.enter;
  const W = PP.size.width, H = PP.size.height, upright = H > W, u = Math.min(W, H) / 1080;
  const D = +P.duration || 10, SHOT = +P.shot_seconds || 28, MAX = +P.dial_max || 35;
  const [T0, T1] = Array.isArray(P.target) ? P.target.map(Number) : [25, 30];
  const C0 = +P.count_from || 1, CS = +P.count_seconds || 7;
  const YIELD = +P.yield_g || 36, DROPS = P.first_drops_s != null ? +P.first_drops_s : 6;
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); $('dial').appendChild(e); return e; };
  // the dial: 270 degrees, the gap at the bottom; 0 s at lower left, MAX at lower right
  const A0 = 135, SWEEP = 270, R = 84;
  const ang = (s) => (A0 + SWEEP * Math.min(1, Math.max(0, s / MAX))) * Math.PI / 180;
  const pt = (s, r) => [Math.cos(ang(s)) * r, Math.sin(ang(s)) * r];
  const arc = (s0, s1, r) => { const [x0, y0] = pt(s0, r), [x1, y1] = pt(s1, r); const big = (ang(s1) - ang(s0)) > Math.PI ? 1 : 0; return `M ${x0} ${y0} A ${r} ${r} 0 ${big} 1 ${x1} ${y1}`; };
  const arcLen = (s0, s1, r) => r * (ang(s1) - ang(s0));

  $('label').textContent = P.label || 'Shot time';
  $('tgt').textContent = `${P.target_label || 'Target'} ${T0}–${T1} s`;
  $('outLabel').textContent = `g ${P.out_label || 'out'}${P.show_ratio && P.ratio_label ? ` · ${P.ratio_label}` : ''}`;

  // The beats, as frames at 30 fps. The bar leads, the plate opens, the dial draws, the words land one after another. The count runs in real
  // seconds, sped up to fit: it is a clock, so it is the one thing here at a constant speed. Then it stops and holds, and the plate closes whole.
  const T = { bar: F(4), plate: F(7), label: F(12), dial: F(10), hero: F(15), tgt: F(18), out: F(21) };
  const LEN = { bar: F(9), plate: F(15), text: F(14), dial: F(24) }, OUT = D - F(14), OUTLEN = F(9), LAND = C0 + CS;

  // the clock keeps its leading zero, as a timer does: the digits never move and the left edge stays shared
  const clock = (s) => s.toFixed(1).padStart(SHOT.toFixed(1).length, '0');
  let track, win, prog, ticks = [], plateW = 0, setSecs = () => {}, setGrams = () => {};
  // grams out by shot time: nothing until the first drops, then a steady, slightly rising flow to the yield at the shot's end
  const grams = (s) => YIELD * Math.pow(Math.min(1, Math.max(0, (s - DROPS) / (SHOT - DROPS))), 1.15);

  PP.scene({
    duration: D,
    setup() {
      const d = Math.round((upright ? 248 : 280) * u), hero = Math.round((upright ? 118 : 132) * u), pad = Math.round(30 * u);
      $('dialwrap').style.width = $('dialwrap').style.height = `${d}px`;
      $('inner').style.padding = `${pad}px ${Math.round(40 * u)}px ${pad}px ${pad}px`; $('inner').style.columnGap = `${Math.round(36 * u)}px`;
      $('col').style.rowGap = `${Math.round(8 * u)}px`;
      for (const id of ['label', 'tgt', 'outRow']) $(id).style.fontSize = `${Math.round(48 * u)}px`;
      $('heroRow').style.fontSize = `${hero}px`;
      setSecs = PP.digits($('secs')); setGrams = PP.digits($('grams'));
      setSecs(clock(SHOT)); setGrams(YIELD.toFixed(1));   // measured at its widest, so the plate fits the last value
      plateW = Math.ceil($('inner').getBoundingClientRect().width);
      $('bar').style.width = `${Math.round(10 * u)}px`;
      const lt = $('lt'), sideM = Math.round(W * (upright ? 0.1 : 0.05));
      lt.style.bottom = `${Math.round(H * (upright ? 0.26 : 0.18))}px`;
      if (P.side === 'right') lt.style.right = `${sideM}px`; else lt.style.left = `${sideM}px`;
      track = el('path', { d: arc(0, MAX, R), fill: 'none', stroke: 'var(--pp-ink)', 'stroke-opacity': 0.3, 'stroke-width': 9 });
      // the target window: the part of the track that counts
      win = el('path', { d: arc(T0, T1, R), fill: 'none', stroke: 'var(--pp-ink)', 'stroke-width': 9 });
      prog = el('path', { d: arc(0, MAX, R), fill: 'none', stroke: 'var(--pp-accent)', 'stroke-width': 9 });
      for (let s = 0; s <= MAX; s += 5) {
        const [x0, y0] = pt(s, R - 13), [x1, y1] = pt(s, R - (s % 10 === 0 ? 24 : 20));
        ticks.push(el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: 'var(--pp-ink)', 'stroke-opacity': 0.55, 'stroke-width': 3.2 }));
      }
    },
    frame(t) {
      const out = PP.ease.exit(PP.clamp((t - OUT) / OUTLEN));
      $('plate').style.width = `${Math.round(plateW * PP.p(t, T.plate, T.plate + LEN.plate, E) * (1 - out) * 10) / 10}px`;
      const barOut = PP.ease.exit(PP.clamp((t - OUT - F(5)) / F(7)));
      $('bar').style.transform = `scaleY(${PP.p(t, T.bar, T.bar + LEN.bar, E) * (1 - barOut)})`;
      const rise = (id, a) => { $(id).style.transform = `translateY(${(1 - PP.p(t, a, a + LEN.text, E)) * 104}%)`; };
      rise('label', T.label); rise('heroRow', T.hero); rise('tgt', T.tgt); rise('outRow', T.out);
      // the dial draws round, then the window and ticks come up
      const L = arcLen(0, MAX, R);
      track.style.strokeDasharray = `${L * PP.p(t, T.dial, T.dial + LEN.dial, E)} 999`;
      track.style.opacity = PP.p(t, T.dial, T.dial + F(3));
      win.style.opacity = PP.p(t, T.dial + F(16), T.dial + F(24));
      ticks.forEach((tk, i) => { tk.style.opacity = PP.p(t, T.dial + F(2) * i, T.dial + F(2) * i + F(8)); });
      // the count: linear (it is a clock), stopping on the shot length
      const s = SHOT * PP.clamp((t - C0) / CS);
      setSecs(clock(s)); setGrams(grams(s).toFixed(1));
      prog.style.strokeDasharray = `${arcLen(0, Math.max(0.0001, s), R)} 999`;
      prog.style.opacity = PP.p(t, C0, C0 + F(3));
    },
    // a clock ticks: the rollup runs under the count, quiet, and one pop as it stops
    sound: () => (P.sound !== true ? [] : [
      { sfx: 'rollup', hit: LAND, dur: Math.min(CS, 6), seed: 3, gain_db: -31 },
      { sfx: 'pop', hit: LAND + F(1), seed: 2, gain_db: -26 },
    ]),
  });
})();
</script>
</body></html>
