<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: var(--pp-paper); }
  body { width: 100vw; height: 100vh; position: relative; }
  /* one tight block, centred in the frame; the masthead is as wide as the title's longest line */
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .mast { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--pp-body); font-weight: 600;
          font-size: var(--small); letter-spacing: 0.18em; text-transform: uppercase; color: var(--pp-ink); }
  .mast .ep { color: var(--pp-muted); }
  .mast .ep b { font-family: var(--pp-mono); font-weight: 500; letter-spacing: 0.04em; color: var(--pp-ink); }
  .mask { overflow: hidden; }
  .mast .mask > span { display: inline-block; }
  .rule { height: 2px; background: var(--pp-ink); opacity: 0.55; margin-top: calc(var(--small) * 0.9); transform-origin: left center; }
  .title { margin-top: calc(var(--big) * 0.3); font-family: var(--pp-display); color: var(--pp-ink); font-size: var(--big);
           line-height: 1.04; letter-spacing: -0.022em; font-weight: 420; font-variation-settings: "opsz" 144, "SOFT" 30; }
  /* each line is a mask; its padding leaves room for descenders and the payoff's underline */
  .line { display: block; overflow: hidden; white-space: nowrap; padding-bottom: 0.2em; margin-bottom: -0.2em; }
  .line > .in { display: inline-block; }
  .w { display: inline-block; will-change: transform; }
  .pay { position: relative; }
  .pay .ul { position: absolute; left: 0.02em; right: 0.02em; bottom: -0.1em; height: 2px; background: var(--pp-accent); transform-origin: left center; transform: scaleX(0); }
</style></head>
<body>
  <div class="card" id="card">
    <div class="mast">
      <div class="mask"><span id="series"></span></div>
      <div class="mask"><span class="ep" id="ep"></span></div>
    </div>
    <div class="rule" id="rule"></div>
    <div class="title" id="title"></div>
  </div>
<script src="../../pp-scene.js"></script>
<script>
  const P = PP.props, $ = (id) => document.getElementById(id);
  const D = +P.duration || 5, k = PP.pace;
  const lines = Array.isArray(P.title_lines) && P.title_lines.length ? P.title_lines.slice(0, 2) : [String(P.title || '')];
  $('series').textContent = P.series || '';
  // the episode number set in mono (every number in mono)
  $('ep').innerHTML = String(P.kicker || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/(\d+)/g, '<b>$1</b>');
  const words = []; let pay = null;
  lines.forEach((ln, li) => {
    const outer = document.createElement('span'); outer.className = 'line'; $('title').appendChild(outer);
    const row = document.createElement('span'); row.className = 'in'; outer.appendChild(row);
    const ws = ln.split(/\s+/).filter(Boolean);
    ws.forEach((w, wi) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w;
      const last = li === lines.length - 1 && wi === ws.length - 1;
      if (last && P.payoff && w.replace(/[.,!?]$/, '') === P.payoff) { s.classList.add('pay'); const u = document.createElement('i'); u.className = 'ul'; s.appendChild(u); pay = s; }
      row.appendChild(s); if (wi < ws.length - 1) row.appendChild(document.createTextNode(' '));
      words.push(s);
    });
  });
  PP.scene({
    duration: D,
    setup() {
      // the longest line (payoff at its final weight) is 70% of the frame width (84% when upright), capped at 19% of the height
      const W = PP.size.width, H = PP.size.height, card = $('card');
      card.style.setProperty('--big', '100px'); if (pay) pay.style.fontWeight = 640;
      const w0 = Math.max(...[...document.querySelectorAll('.line > .in')].map((l) => l.getBoundingClientRect().width));
      if (pay) pay.style.fontWeight = '';
      const px = Math.min(100 * (W * (H > W ? 0.84 : 0.7)) / w0, H * 0.19);
      card.style.setProperty('--big', px + 'px');
      card.style.width = Math.ceil(w0 * px / 100) + 'px';
      card.style.setProperty('--small', Math.max(14, Math.min(H * 0.021, W * 0.03)) + 'px');
    },
    frame(t) {
      // masthead: the rule draws, then series and episode rise through their masks
      $('rule').style.transform = `scaleX(${PP.p(t, 0.1, 0.1 + 0.7 * k, PP.ease.outExpo)})`;
      const rise = (el, a, d = 0.5) => { const p = PP.p(t, a, a + d * k, PP.ease.outQuart); el.style.transform = `translateY(${(1 - p) * 110}%)`; };
      rise($('series'), 0.3); rise($('ep'), 0.42);
      // title words rise through the line mask one after another, each settling in 0.55 s
      words.forEach((w, i) => {
        const a = 0.65 + i * 0.11 * k, p = PP.p(t, a, a + 0.55 * k, PP.ease.outQuart);
        w.style.transform = `translateY(${(1 - p) * 112}%)`;
      });
      // the payoff gains weight and takes the accent, then its underline draws in
      if (pay) {
        const a = 0.65 + (words.length - 1) * 0.11 * k + 0.55 * k;
        const g = PP.p(t, a, a + 0.5 * k, PP.ease.inOut);
        pay.style.fontWeight = Math.round(420 + 220 * g);
        pay.style.color = `color-mix(in srgb, var(--pp-accent) ${Math.round(g * 100)}%, var(--pp-ink))`;
        pay.querySelector('.ul').style.transform = `scaleX(${PP.p(t, a + 0.3 * k, a + 0.9 * k, PP.ease.outExpo)})`;
      }
    },
  });
</script>
</body></html>
