<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: var(--pp-paper); }
  body { width: 100vw; height: 100vh; position: relative; }
  .abs { position: absolute; }
  .mask { position: absolute; overflow: hidden; padding-bottom: 0.15em; }
  .title { font-family: var(--pp-display); font-weight: 520; color: var(--pp-ink); letter-spacing: -0.015em; line-height: 1.05; white-space: nowrap; }
  .punch { font-family: var(--pp-body); font-weight: 500; color: var(--pp-accent); line-height: 1.2; white-space: nowrap; }
  .label { font-family: var(--pp-body); font-weight: 500; color: var(--pp-ink); white-space: nowrap; line-height: 1; }
  .value { font-family: var(--pp-mono); font-weight: 500; color: var(--pp-ink); white-space: nowrap; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .tick { font-family: var(--pp-mono); font-weight: 400; color: var(--pp-muted); white-space: nowrap; line-height: 1; font-variant-numeric: tabular-nums; }
  .source { font-family: var(--pp-body); font-weight: 400; color: var(--pp-muted); white-space: nowrap; line-height: 1.2; }
  .bar { background: var(--pp-ink); transform-origin: left center; }
  .bar.hl { background: var(--pp-accent); }
  .grid { background: var(--pp-muted); }
  .conn { background: var(--pp-muted); transform-origin: center top; }
  .num { font-family: var(--pp-mono); font-size: 0.92em; }
  .hl-text { color: var(--pp-accent); }
</style></head>
<body>
<div id="root"></div>
<script src="../../pp-scene.js"></script>
<script>
  const P = PP.props, k = PP.pace, D = +P.duration || 7;
  const W = PP.size.width, H = PP.size.height, portrait = H > W;
  const u = portrait ? W / 1080 : H / 1080;               // 1 unit = 1 px at 1080p; a phone frame is laid out from its width
  const rows = P.rows || [], total = +P.total || rows.reduce((s, r) => s + +r.value, 0), cur = P.currency || '';
  const root = document.getElementById('root');
  const el = (cls, parent = root) => { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; };
  const px = (n) => `${n}px`;
  // every number in mono (the style's rule), even inside a sentence
  const monoNumbers = (node, text) => { for (const part of String(text).split(/([£$€]?\d[\d.,]*\d|[£$€]?\d)/)) { if (!part) continue; const s = document.createElement('span'); s.textContent = part; if (/\d/.test(part)) s.className = 'num'; node.appendChild(s); } };
  const place = (d, x, y, w, h) => { d.style.left = px(x); d.style.top = px(y); if (w != null) d.style.width = px(w); if (h != null) d.style.height = px(h); };

  // ── layout, all from the frame size ──
  const mx = (portrait ? 80 : 150) * u;
  const labelW = (portrait ? 230 : 270) * u, valueW = 130 * u, gap = 30 * u;
  const x0 = mx + labelW + gap, x1 = W - mx - valueW - gap, scale = (x1 - x0) / total;
  const rowH = (portrait ? 80 : 62) * u, barH = 26 * u;
  const titleS = (portrait ? 76 : 68) * u, punchS = 30 * u, labelS = 26 * u, tickS = 18 * u, srcS = 18 * u;
  const blockH = titleS * 1.1 + 22 * u + punchS * 1.3 + 90 * u + rows.length * rowH + 50 * u + srcS * 1.2;
  const y0 = portrait ? (H - blockH) / 2 : 96 * u;
  const titleY = y0, punchY = y0 + titleS * 1.1 + 22 * u;
  const rowsY = punchY + punchS * 1.3 + 90 * u;
  const srcY = rowsY + rows.length * rowH + 50 * u;

  // title and punchline, each rising out of a mask
  const tMask = el('mask'); place(tMask, mx, titleY); const title = el('title', tMask); title.textContent = P.title || ''; title.style.fontSize = px(titleS);
  const pMask = el('mask'); place(pMask, mx, punchY); const punch = el('punch', pMask); monoNumbers(punch, P.punchline || ''); punch.style.fontSize = px(punchS);

  // the axis: £0 … £5 with faint guides down through the bars
  const axisY = rowsY - 18 * u, guides = [], ticks = [];
  const step = total <= 10 ? 1 : Math.pow(10, Math.floor(Math.log10(total)));
  for (let v = 0; v <= total + 1e-9; v += step) {
    const x = x0 + v * scale;
    const g = el('abs grid'); place(g, x - 0.5 * Math.max(1, u), axisY, Math.max(1, u), rows.length * rowH + 18 * u); guides.push(g);
    const t = el('abs tick'); t.textContent = cur + (Math.abs(v - total) < 1e-9 && total % 1 ? total.toFixed(2) : v.toFixed(v % 1 ? 2 : 0)); t.style.fontSize = px(tickS);
    t.style.top = px(axisY - tickS - 12 * u); t.style.left = px(x); t.style.transform = 'translateX(-50%)'; ticks.push(t);
  }

  // the rows: label, a bar floating at the running total, the value; a hairline joins each bar to the next
  let cum = 0;
  const R = rows.map((r, i) => {
    const y = rowsY + i * rowH, cy = y + rowH / 2, v = +r.value;
    const lab = el('abs label'); lab.textContent = r.label; lab.style.fontSize = px(labelS); place(lab, mx, cy - labelS * 0.5);
    const val = el('abs value'); val.textContent = cur + v.toFixed(2); val.style.fontSize = px(labelS); place(val, W - mx - valueW, cy - labelS * 0.5, valueW);
    const bx = x0 + cum * scale, bw = Math.max(r.highlight ? 4 * u : 1, v * scale);
    const bar = el('abs bar' + (r.highlight ? ' hl' : '')); place(bar, bx, cy - barH / 2, bw, barH);
    let conn = null;
    if (i > 0) { conn = el('abs conn'); place(conn, bx - 0.5 * Math.max(1, u), cy - rowH + barH / 2, Math.max(1, u), rowH - barH); }
    if (r.highlight) { lab.classList.add('hl-text'); val.classList.add('hl-text'); }
    cum += v;
    return { lab, val, bar, conn, hl: !!r.highlight };
  });
  const src = el('abs source'); src.textContent = P.source || ''; src.style.fontSize = px(srcS); place(src, mx, srcY);

  // ── timing: title, axis, each row in order, then the punchline ──
  const T = { title: 0.15, axis: 0.45, row0: 0.75, stagger: 0.36 * k, emph: 0.75 + rows.length * 0.36 * k + 0.35, out: D - 0.45 };
  PP.scene({
    duration: D,
    frame(t) {
      const gone = 1 - PP.p(t, T.out, D, PP.ease.inOut);       // everything settles out together at the end
      root.style.opacity = gone;
      title.style.transform = `translateY(${(1 - PP.p(t, T.title, T.title + 0.5 * k)) * 105}%)`;
      const ax = PP.p(t, T.axis, T.axis + 0.5 * k);
      guides.forEach((g, i) => { g.style.opacity = 0.22 * PP.p(t, T.axis + i * 0.04, T.axis + i * 0.04 + 0.45 * k); });
      ticks.forEach((x, i) => { x.style.opacity = PP.p(t, T.axis + i * 0.04, T.axis + i * 0.04 + 0.45 * k); });
      src.style.opacity = 0.9 * ax;
      const e = PP.p(t, T.emph, T.emph + 0.5 * k, PP.ease.inOut);
      R.forEach((r, i) => {
        const a = T.row0 + i * T.stagger;
        const b = PP.p(t, a, a + 0.5 * k, PP.ease.outQuart);
        r.bar.style.transform = `scaleX(${b})`;
        const txt = PP.p(t, a + 0.05, a + 0.45 * k);
        const dim = r.hl ? 1 : 1 - 0.5 * e;
        r.lab.style.opacity = txt * dim; r.val.style.opacity = txt * dim;
        r.lab.style.transform = r.val.style.transform = `translateY(${(1 - txt) * 0.35 * labelS}px)`;
        r.bar.style.opacity = r.hl ? 1 : 0.9 - 0.55 * e;
        if (r.conn) { const c = PP.p(t, a - 0.12, a + 0.12); r.conn.style.transform = `scaleY(${c})`; r.conn.style.opacity = 0.7 * c * (1 - 0.4 * e); }
      });
      punch.style.transform = `translateY(${(1 - PP.p(t, T.emph + 0.15, T.emph + 0.65 * k)) * 105}%)`;
    },
  });
</script>
</body></html>
