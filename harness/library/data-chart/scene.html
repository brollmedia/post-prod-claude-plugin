<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: var(--pp-paper); }
  body { width: 100vw; height: 100vh; position: relative; }
  .abs { position: absolute; }
  .mask { position: absolute; overflow: hidden; padding-bottom: 0.15em; }
  .title { font-family: var(--pp-display); font-weight: var(--pp-dw, 640); letter-spacing: var(--pp-dt, -0.015em); text-transform: var(--pp-dc, none); font-variation-settings: var(--pp-dv, normal); color: var(--pp-ink); line-height: 1.05; white-space: nowrap; }
  .punch { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); letter-spacing: var(--pp-bt, 0); color: var(--pp-ink); line-height: 1.2; white-space: nowrap; }
  .label { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); letter-spacing: var(--pp-bt, 0); color: var(--pp-ink); white-space: nowrap; line-height: 1.2; }
  .value { font-family: var(--pp-mono); font-weight: 500; color: var(--pp-ink); white-space: nowrap; line-height: 1.2; text-align: right; font-variant-numeric: tabular-nums; }
  .source { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); letter-spacing: var(--pp-bt, 0); color: var(--pp-ink); opacity: 0.8; line-height: 1.2; text-wrap: balance; }
  .bar { background: var(--pp-ink); transform-origin: left center; }
  .bar.hl { background: var(--pp-accent); }
  .conn { background: var(--pp-ink); transform-origin: center top; }
  .num { font-family: var(--pp-mono); }
</style></head>
<body>
<div id="root"></div>
<script src="../../pp-scene.js"></script>
<script>
  const P = PP.props, F = PP.f, E = PP.enter, D = +P.duration || 12.5;
  const W = PP.size.width, H = PP.size.height, portrait = H > W;
  const u = Math.min(W, H) / 1080;                         // 1 unit = 1 px at 1080p; a phone frame is laid out from its width
  const rows = P.rows || [], total = +P.total || rows.reduce((s, r) => s + +r.value, 0), cur = P.currency || '';
  const root = document.getElementById('root');
  const el = (cls, parent = root) => { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; };
  const px = (n) => `${n}px`;
  // every number in mono (the style's rule), even inside a sentence
  const monoNumbers = (node, text) => { for (const part of String(text).split(/([£$€]?\d[\d.,]*\d|[£$€]?\d)/)) { if (!part) continue; const s = document.createElement('span'); s.textContent = part; if (/\d/.test(part)) s.className = 'num'; node.appendChild(s); } };
  const place = (d, x, y, w, h) => { d.style.left = px(x); d.style.top = px(y); if (w != null) d.style.width = px(w); if (h != null) d.style.height = px(h); };
  const paint = PP.ground({ light: [0.15, 0.1] });

  const tMask = el('mask'), title = el('title', tMask); title.textContent = P.title || '';
  const pMask = el('mask'), punch = el('punch', pMask); monoNumbers(punch, P.punchline || '');
  const R = rows.map((r) => {
    const lab = el('abs label'); lab.textContent = r.label;
    const val = el('abs value'); val.textContent = cur + (+r.value).toFixed(2);
    const bar = el('abs bar' + (r.highlight ? ' hl' : ''));
    return { lab, val, bar, conn: null, hl: !!r.highlight, v: +r.value };
  });
  const src = el('abs source'); src.textContent = P.source || '';

  // ── timing: the title, each row in order, then the punchline, then time to read it. Rows close up when there are many, so a long list stays quick ──
  const step = Math.min(F(12), 3.4 / Math.max(1, rows.length)), first = F(18);
  const T = { title: -1, row0: first, step, emph: first + rows.length * step + F(14), out: D - F(12) };
  const LANDED = T.row0 + (rows.length - 1) * step + F(10);
  PP.scene({
    duration: D,
    setup() {
      // ── layout, all from the frame size and the words as they really measure ──
      const side = W * (portrait ? 0.1 : 0.05), inner = W - side * 2;
      PP.fit(title, inner, 92 * u, 56 * u); PP.fit(punch, inner, 60 * u, 48 * u);
      src.style.fontSize = px(48 * u); src.style.width = px(inner);   // a long source takes two lines rather than running off the frame
      const textS = 48 * u, lineH = textS * 1.2;
      for (const r of R) { r.lab.style.fontSize = px(textS); r.val.style.fontSize = px(textS); }
      const labelW = Math.ceil(Math.max(...R.map((r) => r.lab.getBoundingClientRect().width), 0));
      const valueW = Math.ceil(Math.max(...R.map((r) => r.val.getBoundingClientRect().width), 0));
      const gap = 32 * u, titleH = title.getBoundingClientRect().height, punchH = punch.getBoundingClientRect().height, srcH = P.source ? src.getBoundingClientRect().height : 0;
      const top = H * (portrait ? 0.08 : 0.075), head = titleH + 8 * u + punchH + (portrait ? 56 : 34) * u, foot = srcH ? srcH + 26 * u : 0;
      const room = H * (portrait ? 0.84 : 0.88) - head - foot;
      // upright, each row is its words with its bar under them, across the whole width; wide, words and bar share a line
      const rowH = Math.min((portrait ? 170 : 104) * u, room / Math.max(1, rows.length));
      const barH = portrait ? Math.max(16 * u, rowH - lineH - 26 * u) : Math.max(24 * u, Math.min(rowH * 0.54, 44 * u));
      const x0 = portrait ? side : side + labelW + gap, x1 = portrait ? W - side : W - side - valueW - gap, scale = (x1 - x0) / total;
      const blockH = head + rows.length * rowH + foot, y0 = portrait ? (H - blockH) * 0.46 : top;
      place(tMask, side, y0); place(pMask, side, y0 + titleH + 8 * u);
      const rowsY = y0 + head;
      let cum = 0;
      R.forEach((r, i) => {
        const y = rowsY + i * rowH, textY = portrait ? y : y + (rowH - lineH) / 2, barY = portrait ? y + lineH + 10 * u : y + (rowH - barH) / 2;
        place(r.lab, side, textY); place(r.val, W - side - valueW, textY, valueW);
        const bx = x0 + cum * scale, bw = Math.max(r.hl ? 8 * u : 4 * u, r.v * scale);
        place(r.bar, Math.min(bx, x1 - bw), barY, bw, barH);
        // a joiner carries each bar on to the next. Upright it would cross the words, so there the running start of each bar does the job
        if (i > 0 && !portrait) { r.conn = el('abs conn'); place(r.conn, bx - 2 * u, barY - (rowH - barH), 4 * u, rowH - barH); }
        cum += r.v;
      });
      place(src, side, rowsY + rows.length * rowH + 26 * u);
    },
    frame(t) {
      paint(t);
      const gone = PP.ease.exit(PP.clamp((t - T.out) / F(7)));   // everything settles out together at the end
      root.style.opacity = 1 - gone; root.style.transform = `translateY(${-gone * 12 * u}px)`;
      title.style.transform = `translateY(${(1 - PP.p(t, T.title, T.title + F(18), E)) * 105}%)`;
      const e = PP.p(t, T.emph, T.emph + F(14), PP.ease.inOut);
      R.forEach((r, i) => {
        const a = T.row0 + i * T.step;
        // data lands dead on: no overshoot on a bar
        r.bar.style.transform = `scaleX(${PP.p(t, a, a + F(14), PP.ease.snap)})`;
        r.bar.style.opacity = PP.p(t, a, a + F(3)) * (r.hl ? 1 : 0.9 - 0.34 * e);
        const txt = PP.p(t, a + F(1), a + F(12), E);
        r.lab.style.opacity = r.val.style.opacity = txt;
        r.lab.style.transform = r.val.style.transform = `translateY(${(1 - txt) * 8 * u}px)`;
        if (r.conn) { const c = PP.p(t, a - F(3), a + F(3), E); r.conn.style.transform = `scaleY(${c})`; r.conn.style.opacity = 0.42 * c * (1 - 0.4 * e); }
      });
      punch.style.transform = `translateY(${(1 - PP.p(t, T.emph, T.emph + F(14), E)) * 105}%)`;
      src.style.opacity = 0.8 * PP.p(t, T.emph + F(6), T.emph + F(16));
    },
    // the bars climb on one soft rollup, and the punchline gets the one small hit
    sound: () => (P.sound !== true ? [] : [
      { sfx: 'room', at: 0, dur: D, seed: 2, gain_db: -46 },
      { sfx: 'rollup', hit: LANDED, dur: Math.min(5, Math.max(0.5, LANDED - T.row0)), seed: 3, gain_db: -24, rate: 14 },
      { sfx: 'swell', hit: T.emph + F(2), dur: 0.6, seed: 2, gain_db: -22 },
      { sfx: 'impact', hit: T.emph + F(2), seed: 5, size: 0.6, gain_db: -14 },
    ]),
  });
</script>
</body></html>
