<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; position: relative; }
  /* captions sit centred with their bottom clear of the player's controls (the bottom 18%; 24% upright, clear of the phone app's own buttons),
     on a solid plate that holds on any footage. Two lines at most: a long sentence is broken into cues rather than stacked. */
  .cap { position: absolute; left: var(--capx); right: var(--capx); bottom: var(--capb); height: 0; }
  .cap > div, .cap .chunk { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; }
  .plate { display: inline-block; max-width: 100%; box-sizing: border-box; background: var(--pp-paper); padding: 0.2em 0.5em 0.26em; text-wrap: balance; }
  .sentence, .highlight { font-family: var(--pp-body); font-weight: var(--pp-bw, 600); letter-spacing: var(--pp-bt, 0); font-size: var(--capsz); line-height: 1.2; color: var(--pp-ink); }
  .chunks { font-family: var(--pp-display); font-weight: var(--pp-dw, 640); letter-spacing: var(--pp-dt, -0.015em); text-transform: var(--pp-dc, none); font-variation-settings: var(--pp-dv, normal); font-size: var(--capsz); line-height: 1.1; color: var(--pp-ink); }
  /* the word being said: an accent bar under it, so the words themselves never lose their contrast */
  .pp-w.live { box-shadow: 0 0.09em 0 var(--pp-accent); }
  .label { position: absolute; top: 6vh; right: 5.5vw; font-family: var(--pp-body); font-weight: var(--pp-bw, 600); font-size: var(--lblsz); line-height: 1.2; color: var(--pp-ink); background: var(--pp-paper); padding: 0.2em 0.5em; }
</style></head>
<body>
  <div class="label" id="label"><span id="lname"></span></div>
  <div class="cap" id="cap"></div>
<script src="../../pp-scene.js"></script>
<script>
  const P = PP.props, $ = (id) => document.getElementById(id), F = PP.f;
  const STYLES = ['sentence', 'highlight', 'chunks'];
  const D = +P.duration || 13.9, LINGER = P.linger != null ? +P.linger : 0.35, CMAX = Math.max(1, +P.chunk_max_words || 3);
  const names = P.style_names || {};
  const W = PP.size.width, H = PP.size.height, up = H > W, u = Math.min(W, H) / 1080;
  const sentences = [];   // [{ style, a, b, tokens: [{ text, start, end }], el, spans, chunks }]

  // Spaced evenly over the scene: what the captions fall back on when there are no word timings to read (none set, or the file is missing).
  // Close enough to judge the look; give it real timings before it goes over a voice.
  const evenly = () => {
    const toks = String(P.text || '').split(/\s+/).filter(Boolean), a = 0.3, each = Math.max(0.05, (D - 0.7 - a) / Math.max(1, toks.length));
    return toks.map((w, i) => ({ w, start: a + i * each, end: a + (i + 1) * each }));
  };
  // the transcript's words carry the times; props.text carries the punctuation. Token i of the text is word i of the json.
  async function loadWords() {
    if (Array.isArray(P.words)) return P.words;
    if (!P.words) return evenly();
    try {
      const r = await fetch(new URL(P.words, location.href));
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch (e) {
      console.warn(`subtitles: could not read the word timings at ${P.words} (${e.message}): spacing the text evenly instead`);
      return evenly();
    }
  }
  function build(words) {
    const toks = String(P.text || words.map((w) => w.w).join(' ')).split(/\s+/).filter(Boolean);
    const norm = (s) => s.toLowerCase().replace(/[^a-z0-9'£]/g, '');
    const same = toks.length === words.length;
    if (!same) console.warn(`subtitles: the text has ${toks.length} words, the timings ${words.length}; showing the timings' own words`);
    const T = same ? toks.map((x, i) => {
      if (norm(x) !== norm(words[i].w)) console.warn(`subtitles: word ${i + 1} is "${x}" in the text but "${words[i].w}" in the timings`);
      return { text: x, start: +words[i].start, end: +words[i].end };
    }) : words.map((w) => ({ text: w.w, start: +w.start, end: +w.end }));
    // sentences end on . ? !, and a sentence too long for two lines at this width breaks at a comma if it can, else at a word
    const size = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--capsz')), inner = W - 2 * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--capx'));
    const lineChars = Math.floor((inner - size) / (size * 0.56)), most = Math.min(84, lineChars * 2 - 4);
    const len = (c) => c.map((x) => x.text).join(' ').length;
    let cur = [];
    const flush = () => { if (cur.length) sentences.push({ tokens: cur }); cur = []; };
    for (const tk of T) {
      if (cur.length && len(cur) + 1 + tk.text.length > most) {
        const comma = cur.findLastIndex((x) => /[,;:]["')]*$/.test(x.text));
        if (comma >= 0 && comma < cur.length - 1 && comma >= 2) { const rest = cur.slice(comma + 1); cur = cur.slice(0, comma + 1); flush(); cur = rest; } else flush();
      }
      cur.push(tk);
      if (/[.?!]["')]*$/.test(tk.text)) flush();
    }
    flush();
    const pick = STYLES.includes(P.style) ? P.style : null;   // anything else (e.g. "demo") cycles demo_styles per sentence
    const demo = (P.demo_styles || STYLES).filter((s) => STYLES.includes(s));
    sentences.forEach((s, i) => {
      s.style = pick || demo[i % demo.length] || 'sentence';
      s.a = s.tokens[0].start;
      // a caption stays up for LINGER after its last word, never past the next one's first word, and never past the end of the scene
      s.b = Math.min(s.tokens[s.tokens.length - 1].end + LINGER, D - F(3));
    });
    sentences.forEach((s, i) => { const n = sentences[i + 1]; if (n) s.b = Math.min(s.b, n.a); });
    for (const s of sentences) {
      const el = document.createElement('div'); el.className = s.style; $('cap').appendChild(el); s.el = el;
      if (s.style === 'chunks') {
        // 1 to CMAX words, broken after punctuation; shown without commas and stops
        s.chunks = []; let c = [];
        s.tokens.forEach((tk, j) => { c.push(tk); if (/[,.;:?!]["')]*$/.test(tk.text) || c.length >= CMAX || j === s.tokens.length - 1) { s.chunks.push(c); c = []; } });
        s.chunks.forEach((c2, j) => {
          const d = document.createElement('div'); d.className = 'chunk';
          const pl = document.createElement('div'); pl.className = 'plate'; pl.textContent = c2.map((x) => x.text.replace(/[,.;:]+$/, '')).join(' ');
          d.appendChild(pl); el.appendChild(d); c2.el = d; c2.a = c2[0].start;
          const nx = s.chunks[j + 1]; c2.b = nx ? nx[0].start : s.b;
        });
      } else {
        const pl = document.createElement('div'); pl.className = 'plate'; el.appendChild(pl);
        pl.textContent = s.tokens.map((x) => x.text).join(' ');
        s.spans = PP.split(pl).map((w) => w.el);
      }
    }
  }
  PP.scene({
    duration: D,
    async setup() {
      const r = document.documentElement.style;
      r.setProperty('--capb', `${(up ? 0.24 : 0.19) * H}px`);
      r.setProperty('--capx', `${W * (up ? 0.07 : 0.1)}px`);
      r.setProperty('--capsz', `${Math.round((up ? 60 : 66) * u)}px`);    // 60 to 70 px at 1080p: the low end upright, where a line holds fewer words
      r.setProperty('--lblsz', `${Math.round(48 * u)}px`);
      build(await loadWords());
      if (!P.show_style_label) $('label').style.display = 'none';
    },
    frame(t) {
      if (!sentences.length) return;
      // the corner label names the style of the caption that is up (or next), and changes halfway through each gap
      const sw = sentences.map((s, i) => { const n = sentences[i + 1]; return n ? (s.b + n.a) / 2 : Infinity; });
      const cur = sentences[sw.findIndex((x) => t < x)] || sentences[sentences.length - 1];
      $('lname').textContent = names[cur.style] || cur.style;
      $('label').style.opacity = PP.p(t, 0, F(6)) * (1 - PP.p(t, D - F(8), D - F(2), PP.ease.exit));
      for (const s of sentences) {
        // up from the first word's start to the caption's end, to the frame
        const on = t >= s.a && t < s.b;
        s.el.style.visibility = on ? 'visible' : 'hidden';
        // a chunk set visible would show through its hidden parent, so every chunk is hidden by name when its caption is off
        if (!on) { if (s.chunks) for (const c of s.chunks) c.el.style.visibility = 'hidden'; continue; }
        s.el.style.opacity = Math.min(PP.clamp((t - s.a) / F(3)), PP.clamp((s.b - t) / F(2)));
        if (s.style === 'highlight') {
          // the word being said carries the accent bar, from its start until the next word starts
          s.spans.forEach((sp, j) => {
            const tk = s.tokens[j], nx = s.tokens[j + 1];
            sp.classList.toggle('live', t >= tk.start && t < (nx ? nx.start : s.b));
          });
        } else if (s.style === 'chunks') {
          s.chunks.forEach((c) => {
            const v = t >= c.a && t < c.b;
            c.el.style.visibility = v ? 'visible' : 'hidden';
            if (v) c.el.style.opacity = PP.clamp((t - c.a) / F(4));
          });
        }
      }
    },
  });
</script>
</body></html>
