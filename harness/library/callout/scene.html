<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; position: relative; }
  #guide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  /* an edge in the look's paper: a line in one colour vanishes wherever the picture turns that colour, and footage always does somewhere */
  .ink { fill: none; stroke: var(--pp-accent); stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 2px var(--pp-paper)) drop-shadow(0 0 1px var(--pp-paper)); }
  /* the words sit on a solid plate with the accent bar down one side: a plate holds its contrast on a bright sky, a soft dark field does not */
  .plate { position: absolute; display: flex; align-items: stretch; white-space: nowrap; }
  .pbar { flex: none; background: var(--pp-accent); }
  .pbody { background: var(--pp-paper); overflow: hidden; box-sizing: border-box; }
  .inner { width: max-content; box-sizing: border-box; }
  .mask { overflow: hidden; }
  .line { font-family: var(--pp-display); font-weight: var(--pp-dw, 640); letter-spacing: var(--pp-dt, -0.015em); text-transform: var(--pp-dc, none); font-variation-settings: var(--pp-dv, normal); line-height: 1.14; color: var(--pp-ink); }
  .tag { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); letter-spacing: var(--pp-bt, 0); line-height: 1.2; color: var(--pp-ink); opacity: 0.82; }
</style></head>
<body>
  <svg id="svg">
    <path class="ink" id="ring"/>
    <path class="ink" id="arrow" data-pp-from="label"/>
    <path class="ink" id="head"/>
    <path class="ink" id="box"/>
  </svg>
  <div class="plate" id="label"><div class="pbar" id="bar1"></div><div class="pbody" id="body1"><div class="inner" id="in1"><div class="mask"><div class="line" id="line"></div></div></div></div></div>
  <div class="plate" id="boxlabel"><div class="pbar" id="bar2"></div><div class="pbody" id="body2"><div class="inner" id="in2">
    <div class="mask" id="tagM"><div class="tag" id="tag"></div></div>
    <div class="mask"><div class="line" id="data"></div></div>
  </div></div></div>
<script src="../../pp-scene.js"></script>
<script>
  const P = PP.props, $ = (id) => document.getElementById(id), F = PP.f, E = PP.enter;
  const D = +P.duration || 9;
  const W = PP.size.width, H = PP.size.height, portrait = H > W, u = Math.min(W, H) / 1080;
  // positions are in the footage's own pixels (props.frame), mapped the way the footage is fitted: cover, about focus_x, focus_y (0.5 is centred).
  // An upright crop of wide footage keeps a slice of it: focus_x says which slice.
  const FW = P.frame?.w || 1920, FH = P.frame?.h || 1080, S = Math.max(W / FW, H / FH);
  const place = (size, full, f) => Math.min(0, Math.max(size - full, size / 2 - full * f));
  const OX = place(W, FW * S, P.frame?.focus_x ?? 0.5), OY = place(H, FH * S, P.frame?.focus_y ?? 0.5);
  const X = (x) => OX + x * S, Y = (y) => OY + y * S, L = (v) => v * S;
  const sw = Math.max(4, 6 * u);                              // nothing thinner survives YouTube's bitrate
  for (const id of ['ring', 'arrow', 'head', 'box']) $(id).style.strokeWidth = sw;
  const mx = W * (portrait ? 0.1 : 0.05), my = H * 0.05;       // title-safe, and clear of the phone edges upright
  const floor = H * (portrait ? 0.76 : 0.82);                  // captions and the player live below this

  // keyed positions, eased between keys so the follow never jerks
  const at = (keys, t) => {
    if (!keys || !keys.length) return null;
    if (t <= keys[0].t) return keys[0];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i].t) {
      const a = keys[i - 1], b = keys[i], v = PP.ease.inOut((t - a.t) / Math.max(1e-6, b.t - a.t)), o = {};
      for (const key of Object.keys(b)) o[key] = PP.lerp(a[key] ?? b[key], b[key], v);
      return o;
    }
    return keys[keys.length - 1];
  };

  // the hand-drawn ring: one full turn, its radius breathing slightly as a pen would, and ending exactly where it began: an overlap
  // reads as a tick left on the picture
  const squash = +P.ring?.squash || 0.3, tilt = (+P.ring?.tilt || 0) * Math.PI / 180;
  function ringPath(c) {
    const rx = L(c.r), ry = L(c.r) * squash, cx = X(c.x), cy = Y(c.y), pts = [];
    const a0 = Math.PI * 1.08, turn = Math.PI * 2, N = 140;
    for (let i = 0; i <= N; i++) {
      const v = i / N, a = a0 + turn * v;
      const wob = 1 + 0.018 * Math.sin(2 * a + 0.7) + 0.009 * Math.sin(3 * a + 2.1);
      const ex = Math.cos(a) * rx * wob, ey = Math.sin(a) * ry * wob;
      pts.push([cx + ex * Math.cos(tilt) - ey * Math.sin(tilt), cy + ex * Math.sin(tilt) + ey * Math.cos(tilt)]);
    }
    return { d: `M${pts.map((p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L')}`, cx, cy, rx, ry };
  }

  $('line').textContent = [P.label?.lead, P.label?.text].filter(Boolean).join(' ');
  $('tag').textContent = P.box?.tag || ''; $('data').textContent = P.box?.text || '';
  if (!P.box?.tag) $('tagM').style.display = 'none';
  if (!P.box?.keys?.length) $('boxlabel').style.display = 'none';
  // props.guide (lining up only): the footage behind the graphics. Only added when set: the harness waits on every <video>, and one with no source costs it seconds a frame
  if (P.guide) { const v = document.createElement('video'); v.id = 'guide'; v.muted = true; v.preload = 'auto'; v.src = P.guide; v.style.display = 'block'; document.body.prepend(v); }

  // The beats, in frames at 30 fps. Ring first (the hero: the longest move), the arrow from it, the label last. Each beat is held long
  // enough to read and leaves all at once, quicker than it came. The second beat runs off the first, so it holds wherever the first ends.
  const T = { ring: F(6), ringLen: F(22), arrow: F(16), arrowLen: F(14), plate: F(20), plateLen: F(14), line: F(23), lineLen: F(14) };
  const OUT1 = Math.max(D * 0.44, T.line + T.lineLen + 2.5), B0 = OUT1 + F(10), OUT2 = D - F(13), OUTLEN = F(9);
  const BL = { plate: B0 + F(10), line: B0 + F(13) };

  let labelBox = null, boxSize = null, onTop = false;   // onTop: upright, the label goes over the ring when there is no room under it
  const bodyW = [0, 0];
  const fitPlate = (bar, inner, lines, maxW) => {
    const pad = [Math.round(18 * u), Math.round(30 * u), Math.round(20 * u), Math.round(24 * u)];
    inner.style.padding = pad.map((v) => `${v}px`).join(' ');
    bar.style.width = `${Math.round(10 * u)}px`;
    for (const [el, top, min] of lines) PP.fit(el, maxW - pad[1] - pad[3] - 10 * u, top, min);
    return Math.ceil(inner.getBoundingClientRect().width);
  };
  PP.scene({
    duration: D,
    setup() {
      const maxW = W - mx * 2;
      bodyW[0] = fitPlate($('bar1'), $('in1'), [[$('line'), 60 * u, 48 * u]], maxW);
      bodyW[1] = fitPlate($('bar2'), $('in2'), [[$('tag'), 48 * u, 48 * u], [$('data'), 60 * u, 48 * u]], maxW);
      // the label sits where the props say, kept inside title-safe and above the captions. Upright, it hangs under the ring, or over it: there is no room beside it.
      const lab = $('label'), r = lab.getBoundingClientRect(), first = ringPath(at(P.ring?.keys, 0));
      let lx = X(P.label?.x ?? 190), ly = Y(P.label?.y ?? 590) - r.height / 2;
      if (portrait) { const under = first.cy + first.ry + H * 0.09; lx = mx; onTop = under + r.height > floor; ly = onTop ? first.cy - first.ry - H * 0.09 - r.height : under; }
      lx = Math.min(Math.max(lx, mx), W - mx - r.width); ly = Math.min(Math.max(ly, my), floor - r.height);
      lab.style.left = `${lx}px`; lab.style.top = `${ly}px`;
      labelBox = { x: lx, y: ly, w: r.width, h: r.height };
      const b = $('boxlabel').getBoundingClientRect(); boxSize = { w: b.width, h: b.height };
    },
    frame(t) {
      // beat 1: ring, arrow, label
      const out1 = PP.ease.exit(PP.clamp((t - OUT1) / OUTLEN));
      const c = at(P.ring?.keys, t), ring = ringPath(c);
      $('ring').setAttribute('d', ring.d);
      const len = $('ring').getTotalLength();
      $('ring').style.strokeDasharray = `${len} ${len}`;
      $('ring').style.strokeDashoffset = len * (1 - PP.p(t, T.ring, T.ring + T.ringLen, PP.ease.inOut));
      const seen = (a) => PP.p(t, a, a + F(3)) * (1 - out1);
      $('ring').style.opacity = seen(T.ring);

      // the arrow: from the point on the label's edge nearest the ring, so it plainly belongs to the label, to just outside the ring,
      // bowed, drawn after the ring has started
      const lb = labelBox;
      const sx = PP.clamp(ring.cx, lb.x + 4 * u, lb.x + lb.w - 4 * u), sy = PP.clamp(ring.cy, lb.y, lb.y + lb.h);
      const ang = Math.atan2(sy - ring.cy, sx - ring.cx);
      const ex = ring.cx + Math.cos(ang) * (ring.rx + 36 * u), ey = ring.cy + Math.sin(ang) * (ring.ry + 36 * u);
      const bow = Math.hypot(ex - sx, ey - sy) * 0.16;
      const qx = (sx + ex) / 2 + (portrait ? bow : 0), qy = (sy + ey) / 2 - (portrait ? 0 : bow);
      $('arrow').setAttribute('d', `M${sx} ${sy} Q${qx} ${qy} ${ex} ${ey}`);
      const al = $('arrow').getTotalLength(), ad = PP.p(t, T.arrow, T.arrow + T.arrowLen, E);
      $('arrow').style.strokeDasharray = `${al} ${al}`; $('arrow').style.strokeDashoffset = al * (1 - ad);
      $('arrow').style.opacity = seen(T.arrow);
      const ta = Math.atan2(ey - qy, ex - qx), hl = 22 * u, hp = PP.p(t, T.arrow + T.arrowLen * 0.7, T.arrow + T.arrowLen, E);
      const h1 = [ex - Math.cos(ta - 0.5) * hl * hp, ey - Math.sin(ta - 0.5) * hl * hp], h2 = [ex - Math.cos(ta + 0.5) * hl * hp, ey - Math.sin(ta + 0.5) * hl * hp];
      $('head').setAttribute('d', `M${h1[0]} ${h1[1]} L${ex} ${ey} L${h2[0]} ${h2[1]}`);
      $('head').style.opacity = seen(T.arrow + T.arrowLen * 0.7);

      // the plate opens from its bar, then the words rise; out it closes, whole
      const plate = (bar, body, w, at0, line, atLine, lineLen, out) => {
        $(bar).style.transformOrigin = 'center bottom'; $(bar).style.transform = `scaleY(${PP.p(t, at0 - F(3), at0 + F(6), E)})`;
        $(body).style.width = `${w * PP.p(t, at0, at0 + T.plateLen, E) * (1 - out)}px`;
        $(line).style.transform = `translateY(${(1 - PP.p(t, atLine, atLine + lineLen, E)) * 104}%)`;
        $(bar).parentNode.style.opacity = 1 - out;
      };
      plate('bar1', 'body1', bodyW[0], T.plate, 'line', T.line, T.lineLen, out1);

      // beat 2: the highlight box traces itself around the second detail, its label rises beside it
      const b = at(P.box?.keys, t);
      if (b) {
        const out2 = PP.ease.exit(PP.clamp((t - OUT2) / OUTLEN));
        const bx = X(b.x), by = Y(b.y), bw = L(b.w), bh = L(b.h), rr = 10 * u;
        $('box').setAttribute('d', `M${bx + bw / 2} ${by} H${bx + bw - rr} Q${bx + bw} ${by} ${bx + bw} ${by + rr} V${by + bh - rr} Q${bx + bw} ${by + bh} ${bx + bw - rr} ${by + bh} H${bx + rr} Q${bx} ${by + bh} ${bx} ${by + bh - rr} V${by + rr} Q${bx} ${by} ${bx + rr} ${by} Z`);
        const bl = $('box').getTotalLength(), bd = PP.p(t, B0, B0 + F(18), PP.ease.inOut);
        $('box').style.strokeDasharray = `${bl} ${bl}`; $('box').style.strokeDashoffset = bl * (1 - bd);
        $('box').style.opacity = PP.p(t, B0, B0 + F(3)) * (1 - out2);
        // hung under the box from its right edge: it never sits on the box, and it can never land nearly centred by accident
        const lab = $('boxlabel'), gapB = 32 * u;
        const lx = Math.min(Math.max(mx, bx + bw - boxSize.w), W - mx - boxSize.w);
        const ly = Math.min(by + bh + gapB, floor - boxSize.h);
        lab.style.left = `${lx}px`; lab.style.top = `${ly}px`;
        plate('bar2', 'body2', bodyW[1], BL.plate, 'data', BL.line, T.lineLen, out2);
        $('tag').style.transform = `translateY(${(1 - PP.p(t, BL.line - F(3), BL.line - F(3) + T.lineLen, E)) * 104}%)`;
      }
    },
    // an overlay gets a gesture, not a noise: one soft pop as the label lands, a quieter tick for the second detail
    sound: () => (P.sound !== true ? [] : [
      { sfx: 'pop', hit: T.line + F(3), seed: 3, gain_db: -26 },
      { sfx: 'tick', hit: BL.line + F(3), seed: 5, gain_db: -28, note: 2200 },
    ]),
  });
  // the guide footage (props.guide, for lining up only) follows the scene's time
  const seek0 = window.seek;
  window.seek = async (t) => {
    await seek0(t);
    const v = $('guide');
    if (P.guide && Math.abs(v.currentTime - t) > 1e-3) await new Promise((r) => { v.addEventListener('seeked', r, { once: true }); v.currentTime = t; setTimeout(r, 3000); });
  };
</script>
</body></html>
