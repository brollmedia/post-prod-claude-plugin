<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: var(--pp-paper); }
  body { width: 100vw; height: 100vh; position: relative; }
  .mask { position: absolute; overflow: hidden; padding-bottom: 0.15em; }
  .tag { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); letter-spacing: var(--pp-bt, 0); color: var(--pp-ink); opacity: 0.84; white-space: nowrap; line-height: 1.2; }
  .label { white-space: nowrap; line-height: 1.15; color: var(--pp-ink); }
  .label .v { font-family: var(--pp-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .label .w { font-family: var(--pp-body); font-weight: var(--pp-bw, 560); letter-spacing: var(--pp-bt, 0); }
  .closing { font-family: var(--pp-display); font-weight: var(--pp-dw, 640); letter-spacing: var(--pp-dt, -0.012em); text-transform: var(--pp-dc, none); font-variation-settings: var(--pp-dv, normal); color: var(--pp-ink); white-space: nowrap; line-height: 1.1; }
  svg { position: absolute; overflow: visible; }
  .ico * { fill: none; stroke: var(--pp-ink); stroke-linecap: round; stroke-linejoin: round; }
  .conn { fill: none; stroke: var(--pp-ink); stroke-opacity: 0.5; stroke-linecap: round; stroke-linejoin: round; }
  .und { position: absolute; background: var(--pp-accent); transform-origin: left center; transform: scaleX(0); }
</style></head>
<body>
<div id="root"></div>
<script src="../../pp-scene.js"></script>
<script>
(() => {
  const P = PP.props, F = PP.f, E = PP.enter, D = +P.duration || 8;
  const W = PP.size.width, H = PP.size.height, portrait = H > W;
  const u = Math.min(W, H) / 1080;
  const root = document.getElementById('root'), NS = 'http://www.w3.org/2000/svg';
  const div = (cls, parent = root) => { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; };
  const svg = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const a in at) e.setAttribute(a, at[a]); parent.appendChild(e); return e; };

  // the icons: line drawings on a 64-unit grid, each part drawn on in order (pathLength 1 makes every part draw at the same rate)
  const polar = (cx, cy, r, deg) => [cx + r * Math.cos((deg * Math.PI) / 180), cy - r * Math.sin((deg * Math.PI) / 180)];
  const ICONS = {
    dose: [ // portafilter, with the dose heaped in the basket
      ['path', { d: 'M12 28 H48 L44.5 40.5 Q43.6 43 41 43 H19 Q16.4 43 15.5 40.5 Z' }],
      ['path', { d: 'M48 33 L60 37' }],
      ['path', { d: 'M15 28 Q30 14 45 28' }],
      ['path', { d: 'M26 43 V48 M34 43 V48' }],
    ],
    tamp: [ // tamper pressing the bed level
      ['circle', { cx: 32, cy: 11, r: 5.5 }],
      ['path', { d: 'M32 16.5 V25' }],
      ['path', { d: 'M20 25 H44 V31 H20 Z' }],
      ['path', { d: 'M14 36 H50 L46.5 48.5 Q45.6 51 43 51 H21 Q18.4 51 17.5 48.5 Z' }],
      ['path', { d: 'M17 39.5 H47' }],
    ],
    gauge: (() => { // pressure gauge, the needle on 9 of 12
      const parts = [['circle', { cx: 32, cy: 34, r: 21 }]];
      const ticks = []; for (let v = 0; v <= 12; v += 2) { const a = 225 - (v / 12) * 270, [x1, y1] = polar(32, 34, 17, a), [x2, y2] = polar(32, 34, 13.5, a); ticks.push(`M${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)}`); }
      parts.push(['path', { d: ticks.join(' ') }]);
      const [nx, ny] = polar(32, 34, 14, 225 - (9 / 12) * 270);
      parts.push(['path', { d: `M32 34 L${nx.toFixed(2)} ${ny.toFixed(2)}` }], ['circle', { cx: 32, cy: 34, r: 2.2 }], ['path', { d: 'M32 13 V8 M27 8 H37' }]);
      return parts;
    })(),
    timer: (() => { // stopwatch, the 25–30 s window marked on the dial
      const at = (s, r) => [32 + r * Math.sin((s / 60) * 2 * Math.PI), 36 - r * Math.cos((s / 60) * 2 * Math.PI)];
      const [ax, ay] = at(25, 14), [bx, by] = at(30, 14), [hx, hy] = at(28, 15);
      return [
        ['circle', { cx: 32, cy: 36, r: 20 }],
        ['path', { d: 'M27 9 H37 M32 9 V16' }],
        ['path', { d: 'M47 19.5 L50.5 16' }],
        ['path', { d: `M${ax.toFixed(2)} ${ay.toFixed(2)} A14 14 0 0 1 ${bx.toFixed(2)} ${by.toFixed(2)}`, 'data-w': 2.4 }],
        ['path', { d: `M32 36 L${hx.toFixed(2)} ${hy.toFixed(2)}` }],
        ['circle', { cx: 32, cy: 36, r: 1.8 }],
      ];
    })(),
    cup: [ // the shot in the cup
      ['path', { d: 'M29 8 V22 M35 8 V22' }],
      ['path', { d: 'M16 28 H48 V34 Q48 49 32 49 Q16 49 16 34 Z' }],
      ['path', { d: 'M48 32 Q56 32 56 38.5 Q56 44.5 47 44' }],
      ['path', { d: 'M10 55 H54' }],
    ],
  };

  // layout: a row across a wide frame, a column down a tall one, everything hung from one left edge
  const steps = P.steps || [], n = steps.length;
  const side = W * (portrait ? 0.1 : 0.05), inner = W - side * 2;
  const ic = (portrait ? 132 : 188) * u, labS = 50 * u, gapI = (portrait ? 12 : 24) * u;
  const paint = PP.ground({ light: [0.2, 0.14] });
  const tagM = div('mask'); const tag = div('tag', tagM); tag.textContent = P.tag || ''; tag.style.fontSize = `${Math.round(48 * u)}px`;
  const closeM = div('mask'); const close = div('closing', closeM); close.textContent = P.closing || '';

  const S = steps.map((st) => {
    const s = svg('svg', { class: 'ico', viewBox: '0 0 64 64', width: ic, height: ic }, root);
    const sw = (5 * u * 64) / ic;   // 5 px at 1080p whatever the icon's size: anything thinner goes at YouTube's bitrate
    const parts = (ICONS[st.icon] || []).map(([tag2, at]) => { const e = svg(tag2, { ...at, pathLength: 1, 'stroke-width': at['data-w'] ? sw * 1.4 : sw }, s); e.style.strokeDasharray = '1 1'; return e; });
    const lm = div('mask'); const lab = div('label', lm); lab.style.fontSize = `${labS}px`;
    // the number in mono, its unit and word in the body face: 18 g dose
    if (st.value) for (const part of st.value.split(/([\d.,–-]*\d)/)) { if (!part) continue; const v = div(/\d/.test(part) ? 'v' : 'w', lab); v.style.display = 'inline'; v.textContent = part; }
    if (st.word) { const w2 = div('w', lab); w2.style.display = 'inline'; w2.textContent = (st.value ? ' ' : '') + st.word; }
    const und = div('und');
    return { s, parts, lab, lm, und, st };
  });
  const C = [];
  for (let i = 0; i < n - 1; i++) {
    const s = svg('svg', { width: W, height: H }, root); s.style.left = '0px'; s.style.top = '0px';
    C.push({ s, line: svg('path', { class: 'conn', 'stroke-width': Math.max(4, 5 * u), pathLength: 1 }, s), head: svg('path', { class: 'conn', 'stroke-width': Math.max(4, 5 * u) }, s) });
  }

  // The beats, in frames: the tag, then each step (its icon draws part by part, its label rises), an arrow carrying on to the next, the closing
  // line. Steps close up when there are many, so the closing line still gets its read. Then the steps that matter take the accent.
  const step = Math.min(F(24), Math.max(0.4, (D - 3.6) / Math.max(1, n)));
  const at = (i) => F(14) + i * step;
  const tClose = at(n - 1) + F(26), OUT = D - F(11), nudge = ic * 0.15;
  PP.scene({
    duration: D,
    setup() {
      PP.fit(close, inner, 84 * u, 56 * u);
      const tagH = tag.getBoundingClientRect().height, closeH = close.getBoundingClientRect().height, labH = labS * 1.15, ah = 13 * u;
      const pos = [];
      if (!portrait) {
        const colW = inner / n, gaps = [66, 30, 90].map((g) => g * u);
        const total = tagH + gaps[0] + ic + gaps[1] + labH + gaps[2] + closeH, y0 = (H - total) * 0.46;
        for (let i = 0; i < n; i++) pos.push([side + colW * i, y0 + tagH + gaps[0]]);
        tagM.style.top = `${y0}px`; closeM.style.top = `${y0 + total - closeH}px`;
      } else {
        const rowH = 192 * u, gaps = [54, 56].map((g) => g * u);
        const total = tagH + gaps[0] + n * rowH - (rowH - ic) + gaps[1] + closeH, y0 = (H - total) * 0.46;
        for (let i = 0; i < n; i++) pos.push([side, y0 + tagH + gaps[0] + i * rowH]);
        tagM.style.top = `${y0}px`; closeM.style.top = `${y0 + total - closeH}px`;
      }
      tagM.style.left = closeM.style.left = `${side}px`;
      S.forEach((x, i) => {
        const [px, py] = pos[i];
        x.s.style.left = `${px - nudge}px`; x.s.style.top = `${py}px`;   // the drawings sit inside their grid: this puts their ink, not their box, on the shared edge
        const lx = portrait ? px + ic + 40 * u : px, ly = portrait ? py + (ic - labH) / 2 : py + ic + 30 * u;
        x.lm.style.left = `${lx}px`; x.lm.style.top = `${ly}px`;
        const b = x.lab.getBoundingClientRect();
        Object.assign(x.und.style, { left: `${lx}px`, top: `${ly + labH + 10 * u}px`, width: `${Math.ceil(b.width)}px`, height: `${Math.round(7 * u)}px` });
      });
      // arrows between steps, drawn on as the next step arrives
      C.forEach((c, i) => {
        const [x1, y1] = pos[i], [x2, y2] = pos[i + 1];
        const a = portrait ? [x1 + ic / 2 - nudge, y1 + ic + gapI] : [x1 + ic - nudge + gapI, y1 + ic / 2], b = portrait ? [x2 + ic / 2 - nudge, y2 - gapI] : [x2 - nudge - gapI, y2 + ic / 2];
        c.line.setAttribute('d', `M${a[0]} ${a[1]} L${b[0]} ${b[1]}`);
        c.head.setAttribute('d', portrait ? `M${b[0] - ah} ${b[1] - ah} L${b[0]} ${b[1]} L${b[0] + ah} ${b[1] - ah}` : `M${b[0] - ah} ${b[1] - ah} L${b[0]} ${b[1]} L${b[0] - ah} ${b[1] + ah}`);
        c.line.style.strokeDasharray = '1 1';
      });
    },
    frame(t) {
      paint(t);
      const gone = PP.ease.exit(PP.clamp((t - OUT) / F(7)));
      root.style.opacity = 1 - gone; root.style.transform = `translateY(${-gone * 12 * u}px)`;
      tag.style.transform = `translateY(${(1 - PP.p(t, -1, -0.5, E)) * 110}%)`;
      const hl = PP.p(t, tClose + F(10), tClose + F(24), PP.ease.inOut);
      S.forEach((x, i) => {
        const a = at(i);
        x.parts.forEach((e, j) => { const b = a + j * F(3), p = PP.p(t, b, b + F(16), PP.ease.inOut); e.style.strokeDashoffset = 1 - p; e.style.opacity = PP.p(t, b, b + F(3)); });
        x.lab.style.transform = `translateY(${(1 - PP.p(t, a + F(8), a + F(20), E)) * 112}%)`;
        // at the close, the variables take the accent and the fixed steps' drawings step back. Words stay in the ink: they still have to be read.
        const on = x.st.variable;
        x.s.style.opacity = on ? 1 : 1 - 0.45 * hl;
        if (on) { x.parts.forEach((e) => { e.style.stroke = hl > 0 ? `color-mix(in srgb, var(--pp-accent) ${Math.round(hl * 100)}%, var(--pp-ink))` : ''; }); x.und.style.transform = `scaleX(${hl})`; x.und.style.opacity = hl > 0 ? 1 : 0; } else x.und.style.opacity = 0;
      });
      C.forEach((c, i) => {
        const p = PP.p(t, at(i) + F(14), at(i + 1), PP.ease.inOut);
        c.line.style.strokeDashoffset = 1 - p; c.line.style.opacity = PP.p(t, at(i) + F(14), at(i) + F(17));
        c.head.style.opacity = PP.p(t, at(i + 1) - F(2), at(i + 1) + F(4));
      });
      close.style.transform = `translateY(${(1 - PP.p(t, tClose, tClose + F(16), E)) * 110}%)`;
    },
    // one soft pop per step, never the same twice, and a little light on the closing line
    sound: () => (P.sound !== true ? [] : [
      { sfx: 'room', at: 0, dur: D, seed: 2, gain_db: -46 },
      ...steps.map((_, i) => ({ sfx: 'pop', hit: at(i) + F(8), seed: 3 + i, note: 340 * (1 + 0.04 * i), gain_db: -24 - (i % 2) })),
      { sfx: 'shimmer', hit: tClose + F(4), dur: 1.4, seed: 2, note: 880, gain_db: -26 },
    ]),
  });
})();
</script>
</body></html>
